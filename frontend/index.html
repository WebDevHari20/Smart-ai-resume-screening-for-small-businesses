<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Screener</title>
<style>
:root{--bg:#101827;--bg2:#17243a;--glass:rgba(30,45,68,.78);--glass2:rgba(42,61,89,.9);--line:#31435f;--text:#e7edf7;--mute:#9aaac1;--acc:#5b8def;--accink:#f7faff;--good:#55c9a0;--warn:#e5ad63;--bad:#ef7887;--blue:#6b99f5;--shadow:0 18px 50px rgba(2,8,20,.34);--radius:18px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:linear-gradient(135deg,#101827 0%,#17243a 52%,#1e304b 100%);background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;width:65vw;height:65vw;max-width:820px;max-height:820px;right:-18vw;top:-24vw;background:radial-gradient(circle,rgba(74,126,218,.2),transparent 66%);filter:blur(36px);z-index:-1;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--shadow)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}h2{font-size:17px}h3{font-size:14px;color:var(--mute);font-weight:600;margin:16px 0 8px}.mute{color:var(--mute);font-size:13px}.num{font-variant-numeric:tabular-nums}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:rgba(12,22,37,.38);outline:none;transition:border-color .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:var(--acc)}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}select option{color:#13213a}
.btn{border:1px solid var(--line);background:var(--glass2);padding:9px 14px;border-radius:10px;cursor:pointer;transition:background .15s,transform .1s}.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}.btn:disabled{cursor:wait;opacity:.65}.btn.pri{background:var(--acc);color:var(--accink);border-color:transparent;font-weight:650}.btn.sm{padding:5px 10px;font-size:13px}.btn.ok{color:var(--good)}.btn.no{color:var(--bad)}
.spinner{display:inline-block;width:14px;height:14px;margin-right:7px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}
.loading-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(16,24,39,.94);backdrop-filter:blur(10px)}.loading-card{width:min(390px,100%);padding:30px;text-align:center}.loading-card .spinner{width:28px;height:28px;margin:0 0 16px;border-width:3px}.loading-card h2{margin-bottom:8px}.loading-card .btn{margin-top:18px}
#auth{min-height:100%;display:grid;place-items:center;padding:20px}.authcard{width:min(420px,100%);padding:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2367ed,#69a0ff);display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 6px 14px rgba(35,103,237,.28)}
.tabs{display:flex;gap:6px;margin:22px 0 4px}.tabs button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--mute)}.tabs button.on{background:var(--glass2);color:var(--text);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;max-width:1400px;margin:18px auto;padding:14px 22px;position:sticky;top:12px;z-index:4}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;max-width:1400px;margin:0 auto 20px;padding:0 18px}@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{padding:22px}.layout>.panel:first-child{align-self:start;position:sticky;top:18px}.panel>h3{font-size:17px;color:var(--text);margin:0 0 18px}#main{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.job{padding:14px 15px;border-radius:13px;border:1px solid transparent;cursor:pointer;margin-top:8px;transition:background .15s,border-color .15s,transform .15s}.job:hover{background:var(--glass2);transform:translateY(-1px)}.job.on{background:linear-gradient(100deg,rgba(80,128,220,.2),var(--glass2));border-color:rgba(107,153,245,.48);box-shadow:inset 3px 0 var(--blue)}.job b{display:block;font-size:15px}.job .mute{margin-top:3px}
.drop{margin-top:18px;padding:28px 22px;text-align:center;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;color:var(--mute);transition:background .15s,border-color .15s,transform .15s}.drop::before{content:"↑";display:grid;place-items:center;width:36px;height:36px;margin:0 auto 9px;border-radius:50%;background:var(--glass2);color:var(--acc);font-size:20px;font-weight:700}.drop.over,.drop:hover{background:var(--glass2);color:var(--text)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 8px}.tools label{display:flex;align-items:center;gap:6px;margin:0}.tools input[type=checkbox]{width:auto}.tools input[type=number]{width:80px}
.row{display:grid;grid-template-columns:34px 56px minmax(0,1fr) 120px 90px auto;gap:12px;align-items:center;padding:13px 10px;margin-top:6px;border:1px solid transparent;cursor:pointer;border-radius:12px;transition:background .15s,border-color .15s}.row:first-child{margin-top:12px}.row:hover{background:var(--glass)}
.shortlist{margin-top:20px;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(67,111,190,.2),rgba(31,49,77,.5));border:1px solid rgba(107,153,245,.25)}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-heading h3{color:var(--text);margin:0;font-size:16px}.rank{font-weight:700;color:var(--mute)}
.gauge{--p:0;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}.gauge::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg);opacity:.85}.gauge b{position:relative;z-index:1;font-size:13px}.tier-strong_fit{--c:var(--good)}.tier-moderate_fit{--c:var(--warn)}.tier-low_fit{--c:var(--bad)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--glass);margin:2px 4px 2px 0}.chip.g{color:var(--good)}.chip.w{color:var(--warn)}.chip.b{color:var(--bad)}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(480px,calc(100% - 24px));padding:22px;overflow:auto;transform:translateX(110%);transition:transform .28s ease;z-index:5}.drawer.open{transform:none}@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.mini{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:13px}.meter{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--acc)}ul{margin:6px 0;padding-left:18px}li{margin:4px 0}.empty{padding:48px 18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:11px 18px;z-index:9}
@media(max-width:860px){.layout>.panel:first-child{position:static}}@media(max-width:700px){.bar{margin:10px;padding:12px 15px}.layout{padding:0 10px}.panel{padding:16px}.row{grid-template-columns:28px 52px 1fr}.row>:nth-child(n+4){display:none}.drawer{top:8px;right:8px;bottom:8px;width:calc(100% - 16px)}}
</style>
</head>
<body>
<section id="auth">
  <form class="glass authcard" id="authForm">
    <div class="brand"><span class="logo">&#9670;</span>Talent Screener</div>
    <p class="mute" style="margin:10px 0 0">Rank applicants on verified skills, not just keywords.</p>
    <div class="tabs"><button type="button" class="on" data-m="login">Log in</button><button type="button" data-m="register">Create account</button></div>
    <div id="coWrap" hidden><label for="co">Company name</label><input id="co" autocomplete="organization"></div>
    <label for="em">Email</label><input id="em" type="email" required autocomplete="email">
    <label for="pw">Password</label><input id="pw" type="password" required minlength="8" autocomplete="current-password">
    <label for="api">Server address</label><input id="api" value="http://127.0.0.1:8000">
    <button class="btn pri" style="width:100%;margin-top:20px" id="authBtn" type="submit">Log in</button>
  </form>
</section>
<div id="app" hidden>
  <header class="glass bar">
    <div><div class="brand"><span class="logo">&#9670;</span>Talent Screener</div><div class="mute" style="margin:3px 0 0 40px">Evidence-based candidate screening</div></div>
    <div style="display:flex;align-items:center;gap:10px"><span class="mute" id="who"></span><button class="btn sm" id="out" type="button">Log out</button></div>
  </header>
  <main class="layout">
    <aside class="glass panel">
      <h3>New opening</h3>
      <form id="jobForm">
        <label for="jt">Job title</label><input id="jt" required minlength="2">
        <label for="jd">Description (skills are detected automatically)</label><textarea id="jd" rows="5" required minlength="20"></textarea>
        <label for="je">Minimum experience (years)</label><input id="je" type="number" min="0" max="40" step="0.5" value="0">
        <label for="jl">Education</label><select id="jl"><option value="none">Any</option><option value="diploma">Diploma</option><option value="bachelor">Bachelor’s</option><option value="master">Master’s</option><option value="phd">PhD</option></select>
        <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="jp" type="checkbox" checked style="width:auto">Verify GitHub and LeetCode work</label>
        <div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" style="flex:1" type="submit">Create opening</button><button class="btn" style="flex:1" type="button" id="createAnother">Create &amp; add another</button></div>
      </form>
    </aside>
    <section class="glass panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>Job openings</h2><div class="mute" style="margin-top:3px">Select a role to review applicants</div></div><button class="btn sm" id="showAllJobs" type="button" hidden>Show all</button></div>
      <div id="jobs"></div><div id="main"><div class="empty">Select or create a job opening to begin.</div></div>
    </section>
  </main>
</div>
<div class="loading-screen" id="loadingScreen" hidden aria-live="polite">
  <div class="glass loading-card">
    <span class="spinner" aria-hidden="true"></span>
    <h2 id="loadingTitle">Loading your workspace</h2>
    <div class="mute" id="loadingMessage">Fetching job openings and candidate data...</div>
    <button class="btn pri" id="loadingRetry" type="button" hidden>Try again</button>
  </div>
</div>
<aside class="glass drawer" id="drawer" aria-label="Candidate details"></aside>
<div class="glass" id="toast" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const DEMO_WHATSAPP_NUMBERS=["917975389968","916362007694","919663610206","919381181220"];
// View state (selected job, open candidate, filters) is saved so a page reload returns you to the same screen.
let token=store.get("tok"),base=store.get("api")||"http://127.0.0.1:8000",
    jobId=+store.get("job")||null,blind=store.get("blind")==="1",minScore=+store.get("min")||0,
    mode="login",showAllJobs=!jobId,selectedCandidate=null,viewVersion=0;
$("#api").value=base;

function toast(m,bad=false){const t=$("#toast");t.textContent=m;t.style.color=bad?"var(--bad)":"var(--text)";t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4200)}
async function api(path,opt={}){
  const h={...(opt.headers||{})};if(token)h.Authorization="Bearer "+token;
  let r;try{r=await fetch(base+path,{...opt,headers:h})}catch{throw new Error("Cannot reach the server at "+base+". Check that it is running.")}
  if(r.status===401&&token){logout();throw new Error("Session ended. Log in again.")}
  if(!r.ok){let d="";try{d=(await r.json()).detail}catch{}throw new Error(typeof d==="string"&&d?d:"Request failed ("+r.status+")")}
  return r.status===204?null:(r.headers.get("content-type")||"").includes("json")?r.json():r;
}
const jsonOpt=b=>({method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#coWrap").hidden=mode!=="register";$("#authBtn").textContent=mode==="login"?"Log in":"Create account"});
$("#authForm").onsubmit=async e=>{e.preventDefault();base=$("#api").value.trim().replace(/\/$/,"");store.set("api",base);
  const button=$("#authBtn");button.disabled=true;button.innerHTML='<span class="spinner" aria-hidden="true"></span>Signing in...';
  try{const d=await api("/auth/"+mode,jsonOpt({email:$("#em").value,password:$("#pw").value,company:$("#co").value}));token=d.access_token;store.set("tok",token);store.set("em",$("#em").value);await start()}catch(err){toast(err.message,true)}
  finally{button.disabled=false;button.textContent=mode==="login"?"Log in":"Create account"}};
function logout(){token=null;store.set("tok",null);store.set("job",null);store.set("cand",null);$("#app").hidden=true;$("#auth").hidden=false;closeDrawer();jobId=null;showAllJobs=true;selectedCandidate=null}
$("#out").onclick=e=>{e.preventDefault();e.stopPropagation();logout()};

async function start(){
  $("#auth").hidden=true;$("#app").hidden=false;$("#who").textContent=store.get("em")||"";
  const screen=$("#loadingScreen"),title=$("#loadingTitle"),message=$("#loadingMessage"),retry=$("#loadingRetry");
  screen.hidden=false;title.textContent="Loading your workspace";message.textContent="Fetching job openings and candidate data...";retry.hidden=true;
  try{const js=await loadJobs();
    if(jobId&&js.some(j=>j.id===jobId)){showAllJobs=false;await loadJobs();await renderMain();const cid=+store.get("cand");if(cid)await detail(cid)}
    else if(jobId){jobId=null;showAllJobs=true;store.set("job",null);store.set("cand",null);await loadJobs()}
    screen.hidden=true;
  }catch(err){
    title.textContent="Workspace could not be loaded";message.textContent=err.message;retry.hidden=false;
  }
}
$("#loadingRetry").onclick=()=>start();
async function loadJobs(){
  try{const js=await api("/jobs");const visibleJobs=showAllJobs||jobId===null?js:js.filter(j=>j.id===jobId);
    $("#showAllJobs").hidden=showAllJobs||js.length<2;
    $("#jobs").innerHTML=visibleJobs.length?visibleJobs.map(j=>`<div class="job ${j.id===jobId?"on":""}" data-id="${j.id}" tabindex="0"><b>${esc(j.title)}</b><div class="mute">${j.candidate_count} applicant${j.candidate_count===1?"":"s"} · ${j.required_skills.length} required skills</div></div>`).join(""):'<div class="mute" style="margin-top:8px">No openings yet. Create one below.</div>';
    document.querySelectorAll(".job").forEach(el=>{el.onclick=()=>selectJob(+el.dataset.id);el.onkeydown=e=>{if(e.key==="Enter")el.click()}});
    return js;
  }catch(err){toast("Could not load job openings: "+err.message,true);throw err}
}
async function createJob(continueCreating){
  const form=$("#jobForm");if(!form.reportValidity())return;
  const submit=form.querySelector('button[type="submit"]'),another=$("#createAnother");submit.disabled=true;another.disabled=true;
  try{const j=await api("/jobs",jsonOpt({title:$("#jt").value.trim(),description:$("#jd").value.trim(),min_experience:+$("#je").value,education_level:$("#jl").value,requires_proof_of_work:$("#jp").checked}));
    jobId=j.id;store.set("job",jobId);store.set("cand",null);showAllJobs=false;form.reset();toast("Opening created: "+j.title);await loadJobs();
    if(continueCreating)$("#jt").focus();else await renderMain();
  }catch(err){toast("Could not create opening: "+err.message,true)}finally{submit.disabled=false;another.disabled=false}
}
$("#jobForm").onsubmit=async e=>{e.preventDefault();await createJob(false)};$("#createAnother").onclick=()=>createJob(true);$("#showAllJobs").onclick=async()=>{showAllJobs=true;await loadJobs()};
async function selectJob(id){jobId=id;store.set("job",id);store.set("cand",null);viewVersion++;showAllJobs=false;selectedCandidate=null;closeDrawer();await loadJobs();await renderMain()}
async function renderMain(){
  const version=viewVersion,currentJobId=jobId;let j;try{j=await api("/jobs/"+currentJobId)}catch(err){toast(err.message,true);return}
  if(version!==viewVersion||currentJobId!==jobId)return;
  $("#main").innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="mute">Selected job opening</div><h2 style="margin-top:4px">${esc(j.title)}</h2><div class="mute"><span id="jobApplicantCount">${j.candidate_count}</span> applicant${j.candidate_count===1?"":"s"} · ${j.requires_proof_of_work?"GitHub and LeetCode verification enabled":"Work verification disabled"}</div></div><div><button class="btn sm" id="csv" type="button">Export CSV</button> <button class="btn sm no" id="delCandidates" type="button">Delete all candidates</button> <button class="btn sm no" id="delJob" type="button">Delete opening</button></div></div>
  <div class="glass" style="padding:14px;margin-top:18px"><h3 style="margin-top:0">Opening details</h3><p style="white-space:pre-wrap;margin-bottom:12px">${esc(j.description)}</p><div class="mute">Minimum experience: ${j.min_experience} year${j.min_experience===1?"":"s"} · Education: ${esc(j.education_level)}</div><div style="margin-top:10px">Required skills: ${j.required_skills.map(s=>`<span class="chip">${esc(s)}</span>`).join("")||"None detected"}</div></div>
  <div class="drop" id="drop" tabindex="0">Drop resumes here or click to choose (PDF, DOCX, TXT, up to 25 files)<input type="file" id="file" multiple accept=".pdf,.docx,.txt" hidden></div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px"><button class="btn pri" id="rankBtn" type="button">Rank resumes</button><span class="mute" id="rankStatus">Upload resumes, then rank them here.</span></div>
  <div class="tools"><label><input type="checkbox" id="blind" ${blind?"checked":""}>Hide names (blind review)</label><label>Minimum score <input type="number" id="min" min="0" max="100" value="${minScore}"></label></div>
  <section class="shortlist"><div class="section-heading"><h3>Shortlisted candidates</h3><span class="chip g" id="shortlistCount">0 selected</span></div><div class="mute" style="margin-top:3px">Ranked by final score</div><div id="shortlist"><div class="empty" style="padding:22px 10px;margin-top:12px">Candidates you shortlist will appear here.</div></div></section>
  <div class="section-heading" style="margin-top:24px"><h3>All applicants</h3><span class="mute">Sorted by score</span></div><div id="list"></div>`;
  const d=$("#drop"),f=$("#file");d.onclick=()=>f.click();d.onkeydown=e=>{if(e.key==="Enter")f.click()};d.ondragover=e=>{e.preventDefault();d.classList.add("over")};d.ondragleave=()=>d.classList.remove("over");d.ondrop=e=>{e.preventDefault();d.classList.remove("over");upload(e.dataTransfer.files)};f.onchange=()=>upload(f.files);
  $("#rankBtn").onclick=rankResumes;
  $("#blind").onchange=e=>{blind=e.target.checked;store.set("blind",blind?"1":null);loadList()};
  $("#min").onchange=e=>{minScore=Math.max(0,Math.min(100,+e.target.value||0));store.set("min",minScore||null);loadList()};
  $("#csv").onclick=async e=>{e.preventDefault();e.stopPropagation();try{const r=await api(`/jobs/${jobId}/export.csv`);const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download=`job_${jobId}.csv`;a.click();URL.revokeObjectURL(u)}catch(err){toast(err.message,true)}};
  $("#delCandidates").onclick=async e=>{e.preventDefault();e.stopPropagation();const selectedJobId=jobId;
    try{const cur=await api("/jobs/"+selectedJobId);if(!cur.candidate_count)return toast("There are no candidates to delete");
      if(!confirm(`Delete all ${cur.candidate_count} candidates from this opening and all stored resume data permanently?`))return;
      const r=await api(`/jobs/${selectedJobId}/candidates`,{method:"DELETE"});selectedCandidate=null;closeDrawer();await loadList(version,selectedJobId);const js=await loadJobs();const job=js.find(x=>x.id===selectedJobId);if(job&&$("#jobApplicantCount"))$("#jobApplicantCount").textContent=job.candidate_count;toast(`${r.deleted_count} candidate${r.deleted_count===1?"":"s"} deleted`)
    }catch(err){toast("Could not delete candidates: "+err.message,true)}};
  $("#delJob").onclick=async e=>{e.preventDefault();e.stopPropagation();if(!confirm("Delete this opening and all its applicants?"))return;try{await api("/jobs/"+jobId,{method:"DELETE"});jobId=null;store.set("job",null);store.set("cand",null);selectedCandidate=null;showAllJobs=true;viewVersion++;closeDrawer();$("#main").innerHTML='<div class="empty">Opening deleted.</div>';await loadJobs()}catch(err){toast(err.message,true)}};
  await loadList(version,currentJobId);
}
async function upload(files){
  if(!files.length)return;const fd=new FormData();[...files].slice(0,25).forEach(x=>fd.append("files",x));
  const uploadJobId=jobId,uploadVersion=viewVersion,rankButton=$("#rankBtn"),rankStatus=$("#rankStatus");
  if(rankButton){rankButton.disabled=true;rankButton.innerHTML='<span class="spinner" aria-hidden="true"></span>Ranking resumes...'}if(rankStatus)rankStatus.textContent="Analysing resumes, verifying evidence, and calculating scores...";
  toast("Analysing and ranking "+files.length+" resume"+(files.length>1?"s":"")+". This can take a moment.");
  try{const r=await api(`/jobs/${uploadJobId}/resumes`,{method:"POST",body:fd});if(uploadJobId!==jobId||uploadVersion!==viewVersion)return;
    const count=r.processed.length;toast(`${count} added`+(r.errors.length?`, ${r.errors.length} skipped: ${r.errors[0].filename}: ${r.errors[0].error}`:""),r.errors.length&&!count);
    const jobs=await loadJobs(),job=jobs.find(x=>x.id===jobId);if(job&&$("#jobApplicantCount"))$("#jobApplicantCount").textContent=job.candidate_count;
    if(!await loadList(uploadVersion,uploadJobId))throw new Error("The ranked applicant list could not be loaded");if(rankStatus)rankStatus.textContent=count?"Ranking complete. Applicants are shown below.":"No new resumes were added.";
  }catch(err){toast("Could not rank resumes: "+err.message,true);if(rankStatus)rankStatus.textContent="Ranking failed. Please try again."}
  finally{if(rankButton){rankButton.disabled=false;rankButton.textContent="Rank resumes"}}
}
async function rankResumes(){const button=$("#rankBtn"),status=$("#rankStatus");const rankJobId=jobId,rankVersion=viewVersion;button.disabled=true;button.innerHTML='<span class="spinner" aria-hidden="true"></span>Ranking resumes...';status.textContent="Scoring applicants and ordering the best matches...";
  try{if(!await loadList(rankVersion,rankJobId))throw new Error("The ranked applicant list could not be loaded");status.textContent="Ranking complete.";toast("Resume ranking complete")}catch(err){status.textContent="Ranking failed. Please try again.";toast("Could not rank resumes: "+err.message,true)}finally{button.disabled=false;button.textContent="Rank resumes"}}
async function loadList(version=viewVersion,currentJobId=jobId){
  try{const [cs,shortlisted]=await Promise.all([api(`/jobs/${currentJobId}/candidates?blind=${blind}&min_score=${minScore}`),api(`/jobs/${currentJobId}/candidates?blind=${blind}&min_score=${minScore}&status=shortlisted`)]);
    if(version!==viewVersion||currentJobId!==jobId)return false;
    const row=c=>{const confirmation=c.whatsapp_confirmation,confirmationStatus=confirmation&&confirmation.status;
      return `<div class="row" data-id="${c.id}" tabindex="0"><span class="rank num">#${c.rank}</span><div class="gauge tier-${c.tier}" style="--p:${c.final_score}"><b class="num">${Math.round(c.final_score)}</b></div><div><b>${esc(c.name)}</b>${c.needs_manual_review?' <span class="chip b">Review</span>':""}<div class="mute">${c.matched_skills.length} matched${c.missing_skills.length?` · missing ${esc(c.missing_skills.slice(0,3).join(", "))}${c.missing_skills.length>3?"…":""}`:""}</div></div><div class="mute">${c.proof_of_work_score==null?"Work not verified":"Work proof "+Math.round(c.proof_of_work_score*100)+"%"}</div><span class="chip ${{shortlisted:"g",interview:"g",rejected:"b"}[c.status]||""}">${esc(c.status)}</span>${confirmationStatus?`<span class="chip ${confirmationStatus==="accepted"?"g":confirmationStatus==="declined"?"b":"w"}">${esc(confirmationStatus==="accepted"?"Interview accepted":confirmationStatus==="declined"?"Interview declined":"Awaiting response")}</span>`:""}</div>`};
    $("#list").innerHTML=cs.length?cs.map(row).join(""):'<div class="empty">No applicants match. Upload resumes to see the ranking.</div>';
    $("#shortlist").innerHTML=shortlisted.length?shortlisted.map(row).join(""):'<div class="empty" style="padding:22px 10px;margin-top:12px">Candidates you shortlist will appear here.</div>';$("#shortlistCount").textContent=`${shortlisted.length} selected`;
    document.querySelectorAll(".row").forEach(r=>{r.onclick=e=>{e.preventDefault();e.stopPropagation();detail(+r.dataset.id)};r.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();r.click()}}});return true;
  }catch(err){toast("Could not load ranked resumes: "+err.message,true);return false}
}
const LBL={skills:"Required skills",experience:"Experience",education:"Education",semantic:"Role match",proof_of_work:"Proven work"};
async function sendConfirmationLink(){
  const button=$("#sendLink");if(!selectedCandidate||selectedCandidate.status!=="shortlisted")return toast("Shortlist this candidate first",true);
  if(!confirm("Generate a confirmation link and open WhatsApp with a prefilled message? You will still need to press Send."))return;
  if(button){button.disabled=true;button.textContent="Generating..."}
  try{const r=await api(`/candidates/${selectedCandidate.id}/confirmation-link`,{method:"POST"});
    const apiBase=new URL(base).origin;
    const confirmationPage=new URL("confirmation.html",location.href);
    confirmationPage.searchParams.set("token",r.confirmation_path.split("/").pop());
    confirmationPage.searchParams.set("api",apiBase);
    const url=confirmationPage.toString();
    try{await navigator.clipboard.writeText(url)}catch{}
    toast(`Confirmation link copied: ${url}`);
    const phone=r.demo_phone;const message=`Hello, please review your candidate confirmation request: ${url}`;
    // Open WhatsApp in a new tab so this page (and your place in it) stays put.
    if(!window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`,"_blank","noopener")){toast("Link copied. Allow pop-ups to open WhatsApp.")}
    if(button){button.disabled=false;button.textContent="Send confirmation link"}
    await detail(selectedCandidate.id);
  }catch(err){toast(err.message,true);if(button){button.disabled=false;button.textContent="Send confirmation link"}}
}
async function deleteCandidate(id,version=viewVersion,currentJobId=jobId){
  if(!confirm("Delete this candidate and all stored resume data permanently?"))return;
  try{await api(`/candidates/${id}`,{method:"DELETE"});
    if(version!==viewVersion||currentJobId!==jobId)return;
    selectedCandidate=null;closeDrawer();await loadList(version,currentJobId);const js=await loadJobs();const job=js.find(x=>x.id===currentJobId);if(job&&$("#jobApplicantCount"))$("#jobApplicantCount").textContent=job.candidate_count;toast("Candidate deleted");
  }catch(err){toast("Could not delete candidate: "+err.message,true)}
}
async function detail(id){
  const detailJobId=jobId,detailVersion=viewVersion;
  try{
    const c=await api(`/candidates/${id}?blind=${blind}`);
    if(detailJobId!==jobId||detailVersion!==viewVersion)return;
    selectedCandidate=c;store.set("cand",id);const e=c.explanation,p=c.proof_of_work||{},gh=p.github,lc=p.leetcode;
    const comps=Object.entries(e.components).map(([k,v])=>`<div class="mini"><span>${esc(LBL[k]||k)}</span><div class="meter"><i style="width:${v==null?0:v*100}%"></i></div><span class="num">${v==null?"n/a":Math.round(v*100)+"%"}</span></div>`).join("");
    const V={verified:"g",partial:"w",unverified:"b",no_data:""};
    const flagsHtml=c.flags.length?'<h3>Needs attention</h3>'+c.flags.map(f=>`<div class="chip ${f.severity==="high"?"b":"w"}" style="display:block;border-radius:10px;padding:8px 10px">${esc(f.message)}</div>`).join(""):"";
    const claimsHtml=(p.claims||[]).length?'<h3>Claims checked against real work</h3>'+p.claims.map(x=>`<div style="margin:6px 0"><span class="chip ${V[x.verdict]||""}">${esc(x.verdict.replace("_"," "))}</span> <b>${esc(x.skill)}</b><div class="mute">${esc(x.evidence)}</div></div>`).join(""):"";
    const githubHtml=gh&&gh.available?`<h3>GitHub</h3><div class="mute num">${gh.own_repos} own repos · ${gh.commits_90d} commits in 90 days · ${gh.active_days_90d} active days in 90 days · ${gh.stars} stars · ${esc((gh.top_languages||[]).join(", "))}</div>`:"";
    const leetcodeHtml=lc&&lc.available?`<h3>LeetCode</h3><div class="mute num">${lc.total} solved (${lc.easy} easy, ${lc.medium} medium, ${lc.hard} hard) · contest rating ${lc.contest_rating||"none"}</div>`:"";
    const confirmationStatus=c.whatsapp_confirmation&&c.whatsapp_confirmation.status;
    const confirmationLabel=confirmationStatus==="accepted"?"Interview availability accepted":confirmationStatus==="declined"?"Interview availability declined":confirmationStatus==="link_generated"?"Awaiting candidate response":confirmationStatus||"";
    const confirmationClass=confirmationStatus==="accepted"?"g":confirmationStatus==="declined"?"b":"w";
    const confirmationHtml=c.whatsapp_confirmation?`<div class="glass" style="padding:12px;margin-top:18px"><b>Candidate confirmation</b><div class="chip ${confirmationClass}" style="margin-top:7px">${esc(confirmationLabel)}</div><div class="mute">WhatsApp number: +${esc(c.whatsapp_confirmation.phone||"")} · ${c.whatsapp_confirmation.responded_at?`Responded ${esc(new Date(c.whatsapp_confirmation.responded_at).toLocaleString())}`:c.whatsapp_confirmation.expires_at?`Expires ${esc(new Date(c.whatsapp_confirmation.expires_at).toLocaleString())}`:""}</div></div>`:"";
    const sendHtml=c.status==="shortlisted"?'<button class="btn pri" type="button" id="sendLink">Send confirmation link</button>':"";
    const drawer=$("#drawer"),scrollTop=drawer.classList.contains("open")?drawer.scrollTop:0;
    drawer.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:start"><div><h2>${esc(c.name)}</h2><div class="mute">${esc(c.email)}</div></div><button class="btn sm" id="x" type="button">Close</button></div>
    <div style="display:flex;gap:16px;align-items:center;margin:16px 0"><div class="gauge tier-${c.tier}" style="--p:${c.final_score};width:76px;height:76px"><b class="num" style="font-size:20px">${Math.round(c.final_score)}</b></div><div><b>${esc(c.tier.replace("_"," "))}</b><div class="mute">Score out of 100${e.penalty_multiplier<1?` · reduced x${e.penalty_multiplier}`:""}</div></div></div>
    <h3>Why this score</h3>${comps}<ul>${e.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
    ${flagsHtml}
    <h3>Skills</h3>${e.matched_skills.map(s=>`<span class="chip g">${esc(s)}</span>`).join("")}${e.missing_skills.map(s=>`<span class="chip b">${esc(s)} missing</span>`).join("")}
    ${claimsHtml}${githubHtml}${leetcodeHtml}${confirmationHtml}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:22px"><button class="btn" type="button" id="showResume">Show resume (PDF)</button><button class="btn ok" type="button" data-a="shortlist">Shortlist</button><button class="btn" type="button" data-a="interview">Interview</button><button class="btn no" type="button" data-a="reject">Reject</button>${sendHtml}<button class="btn" type="button" id="rv">Re-check work</button><button class="btn no" type="button" id="deleteCandidate">Delete candidate</button></div>`;
    drawer.classList.add("open");drawer.scrollTop=scrollTop;
    drawer.onclick=event=>event.stopPropagation();
    $("#x").onclick=event=>{event.preventDefault();event.stopImmediatePropagation();closeDrawer()};
    drawer.querySelectorAll("[data-a]").forEach(button=>button.onclick=async event=>{
      event.preventDefault();event.stopImmediatePropagation();if(button.disabled)return;button.disabled=true;
      try{await api(`/candidates/${id}/feedback`,jsonOpt({action:button.dataset.a}));
        if(detailJobId!==jobId||detailVersion!==viewVersion)return;
        toast("Marked "+button.dataset.a);
        await loadList(detailVersion,detailJobId);
        if(detailJobId===jobId&&detailVersion===viewVersion)await detail(id);
      }catch(err){toast(err.message,true);button.disabled=false}
    });
    const sendButton=$("#sendLink");if(sendButton)sendButton.onclick=event=>{event.preventDefault();event.stopImmediatePropagation();sendConfirmationLink()};
    $("#showResume").onclick=async event=>{event.preventDefault();event.stopImmediatePropagation();const button=event.currentTarget;const viewer=window.open("about:blank","_blank");if(!viewer)return toast("Allow pop-ups to view the resume PDF",true);button.disabled=true;button.textContent="Preparing PDF...";try{const response=await fetch(`${base}/candidates/${id}/resume.pdf`,{headers:{Authorization:"Bearer "+token}});if(!response.ok)throw new Error("Could not load the resume PDF");const url=URL.createObjectURL(await response.blob());viewer.location=url;setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){viewer.close();toast(err.message,true)}finally{button.disabled=false;button.textContent="Show resume (PDF)"}};
    $("#deleteCandidate").onclick=event=>{event.preventDefault();event.stopImmediatePropagation();deleteCandidate(id,detailVersion,detailJobId)};
    $("#rv").onclick=async event=>{event.preventDefault();event.stopImmediatePropagation();const button=event.currentTarget;if(button.disabled)return;button.disabled=true;
      try{toast("Re-checking GitHub and LeetCode");await api(`/candidates/${id}/reverify`,{method:"POST"});if(detailJobId!==jobId||detailVersion!==viewVersion)return;await loadList(detailVersion,detailJobId);await detail(id)}
      catch(err){toast(err.message,true);button.disabled=false}
    };
  }catch(err){toast(err.message,true);store.set("cand",null)}
}
function closeDrawer(){$("#drawer").classList.remove("open");store.set("cand",null)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
if(token)start();
</script>
</body>
</html>
