services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: screener, POSTGRES_PASSWORD: screener, POSTGRES_DB: screener}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://screener:screener@db:5432/screener
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
